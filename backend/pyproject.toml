[project]
name = "student-study-assistant-backend"
version = "0.1.0"
description = "Backend service for the Student Study Assistant."
authors = [
    { name = "Gaurav", email = "gaurav.harshgiri2003@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.138.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "uvicorn>=0.49.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
